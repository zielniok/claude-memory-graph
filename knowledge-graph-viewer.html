<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code Memory Knowledge Graph</title>
<!-- vis-network 10.1.2 as published on cdnjs, SHA-512 72kDhKs6XZBRuZiKolTT7OPsPzEd9KdAyeDXcYqIw4pKNoc1rpmBpKXTiitf55xARkiu/+jLQdOfQdxD1fmITg== -->
<script src="vis-network.min.js"></script>
<style>
:root {
  --bg: #f6f6f4;
  --surface: #ffffff;
  --text: #1f2328;
  --muted: #5f6873;
  --border: #d8dbe0;
  --accent: #c2185b;
  --link: #1f63d6;
  --edge: #a7aeb6;
  --edge-strong: #5c6670;
  --code-bg: #eef0f2;
  --c-feedback: #d9822b;
  --c-project: #2f6fd0;
  --c-reference: #22915f;
  --c-user: #8e4ec6;
  --c-project_folder: #4b5560;
  --c-other: #b5485d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a;
    --surface: #1d2024;
    --text: #e6e8eb;
    --muted: #9aa3ad;
    --border: #343a41;
    --accent: #f06292;
    --link: #79aefc;
    --edge: #59616a;
    --edge-strong: #a9b1ba;
    --code-bg: #2a2e34;
    --c-feedback: #f0a050;
    --c-project: #6aa1f0;
    --c-reference: #4cc28c;
    --c-user: #b98ae6;
    --c-project_folder: #b4bcc5;
    --c-other: #e37a8e;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
button, input, select { font: inherit; color: inherit; }
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.bar h1 { margin: 0 8px 0 0; font-size: 16px; font-weight: 600; }
.btn, .bar input[type="search"], .bar select {
  height: 32px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
}
.btn { padding: 0 12px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.bar input[type="search"] { flex: 1 1 180px; max-width: 320px; min-width: 0; padding: 0 10px; }
.bar select { min-width: 0; max-width: 100%; padding: 0 8px; }
.bar :disabled { opacity: .5; }
#stats { margin-left: auto; color: var(--muted); font-size: 13px; }
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.legend:empty { display: none; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--bg);
  font-size: 12px;
  cursor: pointer;
}
.chip::before, .badge::before {
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--dot);
  flex: none;
}
.chip[aria-pressed="false"] { opacity: .5; }
.chip[aria-pressed="false"]::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--dot); }
.main { flex: 1; display: flex; min-height: 0; }
.graph-wrap { position: relative; flex: 1; min-width: 0; }
#graph { position: absolute; inset: 0; }
.empty {
  position: absolute;
  inset: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  text-align: center;
  border: 2px dashed var(--border);
  border-radius: 12px;
}
.empty p { margin: 4px 0; }
body.dragging .graph-wrap { outline: 2px solid var(--accent); outline-offset: -2px; }
.panel {
  width: 380px;
  max-width: 45%;
  overflow-y: auto;
  padding: 14px 16px 24px;
  background: var(--surface);
  border-left: 1px solid var(--border);
}
.panel-head { display: flex; align-items: flex-start; gap: 8px; }
.panel h2 { flex: 1; margin: 0; font-size: 16px; overflow-wrap: anywhere; }
.icon-btn {
  width: 28px;
  height: 28px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  flex: none;
}
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin: 6px 0 0; font-size: 13px; }
.badge { display: inline-flex; align-items: center; gap: 6px; }
.panel h3 {
  margin: 18px 0 6px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.obs { margin: 0; padding-left: 20px; }
.obs li { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
code {
  padding: 1px 4px;
  border-radius: 4px;
  background: var(--code-bg);
  font: 12px/1.4 ui-monospace, Consolas, monospace;
}
.rels { margin: 0; padding: 0; list-style: none; }
.rels li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 2px 0; }
.rt { min-width: 84px; color: var(--muted); font-size: 11px; }
.link {
  padding: 0;
  border: 0;
  background: none;
  color: var(--link);
  text-align: left;
  overflow-wrap: anywhere;
  cursor: pointer;
}
.link:hover { text-decoration: underline; }
.source {
  margin-top: 18px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 12px;
  overflow-wrap: anywhere;
}
.muted { color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
div.vis-tooltip {
  max-width: 320px;
  padding: 6px 8px;
  white-space: normal;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
  font: 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (max-width: 760px) {
  .main { flex-direction: column; }
  .graph-wrap { flex: 1 1 auto; min-height: 40dvh; }
  .panel { flex: 0 0 auto; width: auto; max-width: none; height: 50dvh; border-left: 0; border-top: 1px solid var(--border); }
  .bar input[type="search"] { max-width: none; }
  #stats { width: 100%; margin-left: 0; }
}
</style>
</head>
<body>
<header class="bar">
  <h1>Knowledge Graph</h1>
  <button class="btn" id="pick" type="button">Open file</button>
  <input id="file" type="file" accept=".jsonl,.json,.txt" hidden>
  <input id="search" type="search" placeholder="Search name or text, Enter jumps" aria-label="Search" disabled>
  <select id="project" aria-label="Project" disabled><option value="">All projects</option></select>
  <span id="stats"></span>
</header>
<div id="legend" class="legend" aria-label="Show or hide types"></div>
<main class="main">
  <div class="graph-wrap">
    <div id="graph"></div>
    <div id="empty" class="empty">
      <p>Open <strong>knowledge-graph.jsonl</strong> or drop it here.</p>
      <p class="muted" id="empty-note">The file is read in this browser only and is not uploaded anywhere.</p>
    </div>
  </div>
  <aside id="panel" class="panel" hidden></aside>
</main>
<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const TYPE_ORDER = ['feedback', 'project', 'reference', 'user', 'project_folder'];
  const FOLDER = 'project_folder';
  const NO_PROJECT = '\u0000';
  const INFO = /^(source|updated): /;
  const state = {
    entities: new Map(),
    relations: [],
    project: new Map(),
    hiddenTypes: new Set(),
    selectedProject: '',
    query: '',
    matches: [],
    matchIndex: -1,
    bad: 0,
    label: '',
    network: null,
    nodes: null,
    edges: null,
    nodesView: null,
    edgesView: null,
  };

  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function typeColor(type) {
    return /^[a-z0-9_-]+$/i.test(type) && css('--c-' + type) || css('--c-other');
  }

  function rgba(hex, alpha) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex);
    if (!m) return hex;
    const n = parseInt(m[1], 16);
    return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
  }

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function esc(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function inline(s) {
    return esc(s)
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  }

  function parse(text) {
    const entities = new Map();
    const relations = [];
    let bad = 0;
    for (const line of text.split(/\r?\n/)) {
      if (!line.trim()) continue;
      let item;
      try {
        item = JSON.parse(line);
      } catch {
        bad++;
        continue;
      }
      if (item && item.type === 'entity' && typeof item.name === 'string') {
        entities.set(item.name, {
          name: item.name,
          entityType: String(item.entityType ?? ''),
          observations: Array.isArray(item.observations) ? item.observations.map(String) : [],
        });
      } else if (item && item.type === 'relation' && typeof item.from === 'string' && typeof item.to === 'string') {
        relations.push({ from: item.from, to: item.to, relationType: String(item.relationType ?? '') });
      } else {
        bad++;
      }
    }
    return { entities, relations, bad };
  }

  // Project of an entity: its folder via belongs_to, subfolders via part_of up to the top one.
  function assignProjects() {
    const parentOf = new Map();
    const holderOf = new Map();
    for (const r of state.relations) {
      if (r.relationType === 'part_of') parentOf.set(r.from, r.to);
      if (r.relationType === 'belongs_to') holderOf.set(r.from, r.to);
    }
    const top = (name) => {
      const seen = new Set();
      let current = name;
      while (parentOf.has(current) && !seen.has(current)) {
        seen.add(current);
        current = parentOf.get(current);
      }
      return current;
    };
    state.project.clear();
    for (const e of state.entities.values()) {
      if (e.entityType === FOLDER) state.project.set(e.name, top(e.name));
      else if (holderOf.has(e.name)) state.project.set(e.name, top(holderOf.get(e.name)));
      else state.project.set(e.name, NO_PROJECT);
    }
  }

  function isVisible(id) {
    const e = state.entities.get(id);
    if (!e || state.hiddenTypes.has(e.entityType)) return false;
    return !state.selectedProject || state.project.get(id) === state.selectedProject;
  }

  function nodeStyle(e, dimmed) {
    const c = typeColor(e.entityType);
    const ring = css('--text');
    return {
      shape: e.entityType === FOLDER ? 'diamond' : 'dot',
      color: { background: c, border: c, highlight: { background: c, border: ring }, hover: { background: c, border: ring } },
      opacity: dimmed ? 0.15 : 1,
      font: { color: rgba(css('--text'), dimmed ? 0.25 : 1), size: e.entityType === FOLDER ? 15 : 12 },
    };
  }

  function edgeStyle(type) {
    const accent = css('--accent');
    const arrow = (scale) => ({ to: { enabled: scale > 0, scaleFactor: scale } });
    switch (type) {
      case 'links_to':
        return { color: { color: css('--edge-strong'), highlight: accent, hover: accent, opacity: 0.7 }, arrows: arrow(0.5), width: 1, dashes: false };
      case 'belongs_to':
        return { color: { color: css('--edge'), highlight: accent, hover: accent, opacity: 0.6 }, arrows: arrow(0), width: 1, dashes: [2, 4] };
      case 'part_of':
        return { color: { color: css('--edge-strong'), highlight: accent, hover: accent, opacity: 1 }, arrows: arrow(0.7), width: 2.5, dashes: false };
      default:
        return {
          color: { color: css('--c-other'), highlight: accent, hover: accent, opacity: 1 },
          arrows: arrow(0.5),
          width: 1.5,
          dashes: false,
          label: type,
          font: { size: 10, color: css('--muted'), strokeWidth: 0 },
        };
    }
  }

  function networkOptions() {
    return {
      autoResize: true,
      nodes: {
        borderWidth: 1,
        borderWidthSelected: 3,
        scaling: { min: 5, max: 28, label: { enabled: false } },
        font: { face: 'system-ui, -apple-system, Segoe UI, sans-serif' },
      },
      edges: { smooth: { enabled: true, type: 'continuous', roundness: 0.3 }, selectionWidth: 1.5, hoverWidth: 0.5 },
      physics: {
        solver: 'forceAtlas2Based',
        forceAtlas2Based: { gravitationalConstant: -45, centralGravity: 0.008, springLength: 110, springConstant: 0.05, avoidOverlap: 0.5 },
        stabilization: { iterations: 350, updateInterval: 50 },
        minVelocity: 0.75,
      },
      interaction: { hover: true, tooltipDelay: 250, hideEdgesOnDrag: true },
    };
  }

  function build() {
    if (state.network) state.network.destroy();
    const valid = state.relations.filter((r) => state.entities.has(r.from) && state.entities.has(r.to));
    const degree = new Map();
    for (const r of valid) {
      degree.set(r.from, (degree.get(r.from) || 0) + 1);
      degree.set(r.to, (degree.get(r.to) || 0) + 1);
    }
    state.dangling = state.relations.length - valid.length;
    state.nodes = new vis.DataSet([...state.entities.values()].map((e) => ({
      id: e.name,
      label: e.name,
      value: (degree.get(e.name) || 0) + 1,
      title: (e.observations.find((o) => !INFO.test(o)) || e.entityType).slice(0, 280),
      ...nodeStyle(e, false),
    })));
    state.edges = new vis.DataSet(valid.map((r, i) => ({
      id: 'e' + i,
      from: r.from,
      to: r.to,
      relationType: r.relationType,
      title: r.relationType,
      ...edgeStyle(r.relationType),
    })));
    state.nodesView = new vis.DataView(state.nodes, { filter: (n) => isVisible(n.id) });
    state.edgesView = new vis.DataView(state.edges, { filter: (e) => isVisible(e.from) && isVisible(e.to) });
    state.network = new vis.Network($('graph'), { nodes: state.nodesView, edges: state.edgesView }, networkOptions());
    state.network.once('stabilizationIterationsDone', () => state.network.fit({ animation: false }));
    state.network.on('click', (p) => {
      if (p.nodes.length) showPanel(p.nodes[0]);
      else if (!p.edges.length) hidePanel();
    });
  }

  function restyle() {
    if (!state.nodes) return;
    const q = state.query.trim().toLowerCase();
    const hits = new Set(state.matches);
    state.nodes.update([...state.entities.values()].map((e) => ({ id: e.name, ...nodeStyle(e, q !== '' && !hits.has(e.name)) })));
    state.edges.update(state.edges.get().map((e) => ({ id: e.id, ...edgeStyle(e.relationType) })));
  }

  function applySearch() {
    const q = state.query.trim().toLowerCase();
    // Order for Enter: exact name, name contains, text contains.
    const rank = (e) => {
      const name = e.name.toLowerCase();
      if (name === q) return 0;
      if (name.includes(q)) return 1;
      return e.observations.some((o) => o.toLowerCase().includes(q)) ? 2 : -1;
    };
    state.matches = q
      ? [...state.entities.values()]
        .filter((e) => isVisible(e.name))
        .map((e) => [e.name, rank(e)])
        .filter(([, r]) => r >= 0)
        .sort((a, b) => a[1] - b[1])
        .map(([name]) => name)
      : [];
    state.matchIndex = -1;
    restyle();
    updateStats();
  }

  function refresh() {
    state.nodesView.refresh();
    state.edgesView.refresh();
    applySearch();
    if (state.selected && !isVisible(state.selected)) state.network.unselectAll();
  }

  function updateStats() {
    const parts = [`${state.entities.size} entities`, `${state.relations.length} relations`];
    const visible = state.nodesView ? state.nodesView.length : 0;
    if (visible !== state.entities.size) parts.push(`${visible} visible`);
    if (state.query.trim()) parts.push(`${state.matches.length} matches`);
    if (state.bad) parts.push(`${state.bad} invalid lines`);
    if (state.dangling) parts.push(`${state.dangling} relations without entity`);
    $('stats').textContent = parts.join(' · ');
    $('stats').title = state.label;
  }

  function buildLegend() {
    const counts = new Map();
    for (const e of state.entities.values()) counts.set(e.entityType, (counts.get(e.entityType) || 0) + 1);
    const types = [...counts.keys()].sort((a, b) => {
      const ia = TYPE_ORDER.indexOf(a), ib = TYPE_ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
    });
    const legend = $('legend');
    legend.replaceChildren();
    for (const type of types) {
      const chip = el('button', 'chip', `${type || '–'} ${counts.get(type)}`);
      chip.type = 'button';
      chip.style.setProperty('--dot', typeColor(type));
      chip.setAttribute('aria-pressed', 'true');
      chip.title = type === FOLDER
        ? 'Show or hide project folders and their belongs_to edges'
        : 'Show or hide this type';
      chip.addEventListener('click', () => {
        const hide = !state.hiddenTypes.has(type);
        if (hide) state.hiddenTypes.add(type);
        else state.hiddenTypes.delete(type);
        chip.setAttribute('aria-pressed', String(!hide));
        refresh();
      });
      legend.append(chip);
    }
  }

  function buildProjects() {
    const select = $('project');
    const projects = [...new Set(state.project.values())].filter((p) => p !== NO_PROJECT).sort((a, b) => a.localeCompare(b));
    select.replaceChildren(new Option('All projects', ''));
    for (const p of projects) select.append(new Option(p, p));
    if ([...state.project.values()].includes(NO_PROJECT)) select.append(new Option('No project', NO_PROJECT));
    select.value = '';
  }

  function relationList(title, relations, key) {
    if (!relations.length) return null;
    const box = document.createDocumentFragment();
    box.append(el('h3', null, `${title} (${relations.length})`));
    const list = el('ul', 'rels');
    for (const r of relations) {
      const li = el('li');
      li.append(el('span', 'rt', r.relationType));
      const name = r[key];
      if (state.entities.has(name)) {
        const link = el('button', 'link', name);
        link.type = 'button';
        link.addEventListener('click', () => selectNode(name));
        li.append(link);
      } else {
        li.append(el('span', 'muted', `${name} (missing)`));
      }
      list.append(li);
    }
    box.append(list);
    return box;
  }

  function showPanel(name) {
    const e = state.entities.get(name);
    if (!e) return;
    state.selected = name;
    const panel = $('panel');
    panel.hidden = false;
    panel.replaceChildren();

    const head = el('div', 'panel-head');
    const close = el('button', 'icon-btn', '×');
    close.type = 'button';
    close.title = 'Close';
    close.setAttribute('aria-label', 'Close');
    close.addEventListener('click', hidePanel);
    head.append(el('h2', null, e.name), close);

    const meta = el('div', 'meta');
    const badge = el('span', 'badge', e.entityType || '–');
    badge.style.setProperty('--dot', typeColor(e.entityType));
    meta.append(badge);
    const project = state.project.get(name);
    if (project && project !== NO_PROJECT && project !== name) meta.append(el('span', 'muted', project));
    panel.append(head, meta);

    const observations = e.observations.filter((o) => !INFO.test(o));
    if (observations.length) {
      panel.append(el('h3', null, `Observations (${observations.length})`));
      const list = el('ol', 'obs');
      for (const o of observations) {
        const li = el('li');
        li.innerHTML = inline(o);
        list.append(li);
      }
      panel.append(list);
    }
    const outgoing = relationList('Outgoing', state.relations.filter((r) => r.from === name), 'to');
    const incoming = relationList('Incoming', state.relations.filter((r) => r.to === name), 'from');
    if (outgoing) panel.append(outgoing);
    if (incoming) panel.append(incoming);

    const info = e.observations.filter((o) => INFO.test(o));
    if (info.length) {
      const source = el('div', 'source');
      for (const line of info) source.append(el('div', null, line));
      panel.append(source);
    }
    panel.scrollTop = 0;
    if (isVisible(name)) state.network.selectNodes([name]);
    else state.network.unselectAll();
  }

  function hidePanel() {
    state.selected = null;
    $('panel').hidden = true;
    if (state.network) state.network.unselectAll();
  }

  function selectNode(name) {
    showPanel(name);
    if (isVisible(name)) state.network.focus(name, { scale: 1.1, animation: { duration: 400, easingFunction: 'easeInOutQuad' } });
  }

  function showEmpty(message) {
    $('empty').hidden = false;
    if (message) $('empty-note').textContent = message;
  }

  function load(text, label) {
    const parsed = parse(text);
    if (!parsed.entities.size) {
      showEmpty(`No entities found in ${label || 'the file'}.`);
      return;
    }
    Object.assign(state, {
      entities: parsed.entities,
      relations: parsed.relations,
      bad: parsed.bad,
      label: label || '',
      selectedProject: '',
      query: '',
      matches: [],
      matchIndex: -1,
    });
    state.hiddenTypes.clear();
    assignProjects();
    hidePanel();
    $('search').value = '';
    $('search').disabled = false;
    $('project').disabled = false;
    $('empty').hidden = true;
    buildLegend();
    buildProjects();
    build();
    updateStats();
  }

  function readFile(file) {
    if (!file) return;
    const stamp = new Date(file.lastModified).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    file.text().then((text) => load(text, `${file.name}, modified ${stamp}`));
  }

  if (typeof vis === 'undefined') {
    showEmpty('vis-network.min.js is missing. It must be in the same folder as the viewer.');
    $('pick').disabled = true;
    return;
  }

  $('pick').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', (ev) => {
    readFile(ev.target.files[0]);
    ev.target.value = '';
  });

  let searchTimer;
  $('search').addEventListener('input', (ev) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.query = ev.target.value;
      applySearch();
    }, 150);
  });
  $('search').addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter') return;
    clearTimeout(searchTimer);
    if (state.query !== ev.target.value) {
      state.query = ev.target.value;
      applySearch();
    }
    if (!state.matches.length) return;
    state.matchIndex = (state.matchIndex + 1) % state.matches.length;
    selectNode(state.matches[state.matchIndex]);
  });
  $('project').addEventListener('change', (ev) => {
    state.selectedProject = ev.target.value;
    refresh();
    if (state.network) state.network.once('stabilized', () => state.network.fit({ animation: { duration: 300 } }));
  });

  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && !$('panel').hidden) hidePanel();
  });
  let dragDepth = 0;
  document.addEventListener('dragenter', (ev) => {
    ev.preventDefault();
    dragDepth++;
    document.body.classList.add('dragging');
  });
  document.addEventListener('dragover', (ev) => ev.preventDefault());
  document.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) document.body.classList.remove('dragging');
  });
  document.addEventListener('drop', (ev) => {
    ev.preventDefault();
    dragDepth = 0;
    document.body.classList.remove('dragging');
    readFile(ev.dataTransfer.files[0]);
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', restyle);

  // For tests without the file dialog.
  window.loadGraphText = load;
})();
</script>
</body>
</html>
